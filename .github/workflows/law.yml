name: Law check

# Statutes change. Once a month, confirm the wording the site relies on is still
# what legis.la.gov says.
on:
  schedule:
    - cron: "0 14 1 * *"
  workflow_dispatch:

jobs:
  law:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run law
